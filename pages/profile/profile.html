<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Profile — JOHNNY TEC OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles/variables.css" />
<link rel="stylesheet" href="../../styles/global.css" />
<link rel="stylesheet" href="profile.css" />
</head>
<body>
<div id="app">
  <header class="top-bar">
    <div class="top-bar__left">
      <button class="top-bar__icon-btn" id="back-btn" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div>
        <div class="top-bar__title">Profile</div>
      </div>
    </div>
  </header>

  <main class="screen">
    <div class="profile-header">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar-ring">
          <img src="../../assets/images/avatars/profile.jpg" alt="Profile picture" class="profile-avatar-img" id="avatar-img" />
          <div class="profile-avatar-fallback" id="avatar-fallback"></div>
        </div>
      </div>
      <div class="profile-name">
        <span id="profile-name">Loading...</span>
        <span class="verified-badge" id="verified-badge" style="display:none;" title="Email verified">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="m9 12 2 2 4-4"/><path d="M12 2 4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </span>
      </div>
      <div class="profile-email" id="profile-email"></div>
      <div class="profile-meta">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span id="member-since">Member since —</span>
      </div>
      <div class="profile-status">
        <span class="profile-status-dot"></span>Active
      </div>
    </div>

    <div class="profile-stat">
      <div class="profile-stat-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v12H8l-4 4Z"/></svg>
      </div>
      <div>
        <div class="profile-stat-value" id="conversation-count">—</div>
        <div class="profile-stat-label">Conversations</div>
      </div>
    </div>

    <section class="card">
      <div class="section-header"><h2>Johnny's Activity</h2></div>
      <div class="pulse-demo">
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-particle"></div>
        <div class="pulse-particle"></div>
        <div class="pulse-particle"></div>
        <div class="pulse-particle"></div>
        <div class="pulse-core orb">
          <span class="eye"></span><span class="eye"></span>
        </div>
      </div>
      <p class="pulse-caption">Johnny's always awake and ready to help.</p>
    </section>

    <div class="settings-list">
      <button class="settings-row" data-action="personal">
        <div class="settings-row-icon" style="background:#7c6ff0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        </div>
        <div>
          <div class="settings-row-title">Personal Information</div>
          <div class="settings-row-subtitle">Update your personal details</div>
        </div>
        <span class="settings-row-chevron">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg>
        </span>
      </button>

      <button class="settings-row" data-action="security">
        <div class="settings-row-icon" style="background:#4f8ef7;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5Z"/></svg>
        </div>
        <div>
          <div class="settings-row-title">Account &amp; Security</div>
          <div class="settings-row-subtitle">Manage your password and security</div>
        </div>
        <span class="settings-row-chevron">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg>
        </span>
      </button>

      <button class="settings-row" data-action="subscription">
        <div class="settings-row-icon" style="background:#34d399;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
        </div>
        <div>
          <div class="settings-row-title">Subscription</div>
          <div class="settings-row-subtitle">View your plan and billing</div>
        </div>
        <span class="settings-row-chevron">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg>
        </span>
      </button>

      <button class="settings-row" id="history-row">
        <div class="settings-row-icon" style="background:#f59e0b;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l4 2"/></svg>
        </div>
        <div>
          <div class="settings-row-title">Conversation History</div>
          <div class="settings-row-subtitle">View and manage your past chats</div>
        </div>
        <span class="settings-row-chevron">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg>
        </span>
      </button>

      <button class="settings-row" data-action="saved">
        <div class="settings-row-icon" style="background:#a78bfa;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-6-4-6 4Z"/></svg>
        </div>
        <div>
          <div class="settings-row-title">Saved Items</div>
          <div class="settings-row-subtitle">Bookmarks, notes, and saved content</div>
        </div>
        <span class="settings-row-chevron">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg>
        </span>
      </button>

      <button class="settings-row" data-action="settings">
        <div class="settings-row-icon" style="background:#38bdf8;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        </div>
        <div>
          <div class="settings-row-title">Settings</div>
          <div class="settings-row-subtitle">Customize your experience</div>
        </div>
        <span class="settings-row-chevron">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg>
        </span>
      </button>

      <button class="settings-row settings-row--danger" id="logout-row">
        <div class="settings-row-icon" style="background:#f87171;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </div>
        <div>
          <div class="settings-row-title">Log Out</div>
          <div class="settings-row-subtitle">Sign out from your account</div>
        </div>
      </button>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="bottom-nav__item" onclick="window.location.href='../../index.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Home</span>
    </button>
    <button class="bottom-nav__item" onclick="window.location.href='../chat/chat.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H8l-4 4Z"/></svg>
      <span>Chat</span>
    </button>
    <div class="bottom-nav__orb-btn orb" style="width:52px;height:52px; cursor:pointer;" onclick="window.location.href='../live/live.html'">
      <span class="eye"></span><span class="eye"></span>
    </div>
    <button class="bottom-nav__item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/></svg>
      <span>Tools</span>
    </button>
    <button class="bottom-nav__item is-active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>Profile</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script src="../../config/config.js"></script>
<script src="../../services/api.js"></script>
<script src="../../services/auth-service.js"></script>
<script src="../../services/chat-service.js"></script>
<script src="profile.js"></script>
</body>
</html>
