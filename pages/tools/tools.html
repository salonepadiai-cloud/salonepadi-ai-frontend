<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Tools — JOHNNY TEC OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles/variables.css" />
<link rel="stylesheet" href="../../styles/global.css" />
<link rel="stylesheet" href="tools.css" />
</head>
<body>
<div id="app">
  <header class="top-bar">
    <div class="top-bar__left">
      <button class="top-bar__icon-btn" id="back-btn" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="top-bar__title">Tools</div>
    </div>
  </header>

  <main class="screen">
    <p style="color:var(--text-secondary); font-size:13px; margin-bottom: var(--space-4);">
      Connect Johnny to other apps and services.
    </p>

    <button class="tool-tile" id="whatsapp-tile">
      <div class="tool-tile-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20Zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1s-.6.8-.7.9c-.1.1-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.5-1.3.1-.1.1-.3 0-.4l-.7-1.6c-.2-.4-.4-.4-.5-.4h-.5a.9.9 0 0 0-.6.3 2.7 2.7 0 0 0-.8 2 4.7 4.7 0 0 0 1 2.5 10.7 10.7 0 0 0 4.4 3.9c1.6.7 1.6.4 1.9.4a1.6 1.6 0 0 0 1.1-.8 1.4 1.4 0 0 0 .1-.8c-.1-.1-.2-.2-.4-.3Z"/></svg>
      </div>
      <div>
        <div class="tool-tile-title">WhatsApp AI Plugin</div>
        <div class="tool-tile-subtitle">AI-powered WhatsApp Assistant</div>
      </div>
      <div class="tool-tile-status" id="whatsapp-status">
        <span class="tool-tile-status-dot"></span><span>Checking...</span>
      </div>
    </button>

    <div class="tools-empty-hint">More tools coming soon.</div>
  </main>

  <nav class="bottom-nav">
    <button class="bottom-nav__item" onclick="window.location.href='../../index.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Home</span>
    </button>
    <button class="bottom-nav__item" onclick="window.location.href='../chat/chat.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H8l-4 4Z"/></svg>
      <span>Chat</span>
    </button>
    <div class="bottom-nav__orb-btn orb" style="width:52px;height:52px; cursor:pointer;" onclick="window.location.href='../live/live.html'">
      <span class="eye"></span><span class="eye"></span>
    </div>
    <button class="bottom-nav__item is-active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/></svg>
      <span>Tools</span>
    </button>
    <button class="bottom-nav__item" onclick="window.location.href='../profile/profile.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>Profile</span>
    </button>
  </nav>
</div>

<script src="../../config/config.js"></script>
<script src="../../services/api.js"></script>
<script src="../../services/auth-service.js"></script>
<script src="tools.js"></script>
</body>
</html>
