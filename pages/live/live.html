<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Live Conversation — JOHNNY TEC OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles/variables.css" />
<link rel="stylesheet" href="../../styles/global.css" />
<link rel="stylesheet" href="../chat/chat.css" />
<link rel="stylesheet" href="live.css" />
</head>
<body>
<div id="app" style="display:flex; flex-direction:column; height:100vh;">

  <header class="top-bar">
    <div class="top-bar__left">
      <button class="top-bar__icon-btn" id="back-btn" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="live-header" style="flex:1;">
      <h1>Live Conversation</h1>
      <div class="live-header__status">
        <span class="live-header__dot"></span>
        <span>Ready</span>
      </div>
    </div>
    <button class="top-bar__icon-btn" aria-label="Info" title="Voice conversation info">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    </button>
  </header>

  <div class="live-screen">
    <div class="orb-stage">
      <div class="waveform waveform--left" id="wave-left">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="orb live-orb" id="live-orb">
        <span class="eye"></span><span class="eye"></span>
      </div>
      <div class="waveform waveform--right" id="wave-right">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="live-status">
      <h2 id="status-title">Tap the mic to start</h2>
      <p id="status-subtitle">Speak naturally, Johnny is here to help.</p>
    </div>

    <button class="end-btn" id="end-btn" style="display:none;">
      <span class="end-btn__dot">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.9 15.9 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .6 3.6 1 1 0 0 1-.25 1Z"/></svg>
      </span>
      End Conversation
    </button>

    <div class="interim-text" id="interim-text"></div>

    <div class="live-transcript" id="live-transcript">
      <div class="live-empty">Nothing said yet — tap the mic and start talking.</div>
    </div>
  </div>

  <div class="live-controls" id="live-controls">
    <button class="live-control" id="voice-settings-btn" style="background:none; border:none;">
      <div class="live-control__icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M2 14h4"/><path d="M10 8h4"/><path d="M18 16h4"/></svg>
      </div>
      <span>Voice Settings</span>
    </button>

    <button class="mic-btn" id="mic-btn">
      <div class="mic-btn__icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg>
      </div>
      <span id="mic-label">Tap to speak</span>
    </button>

    <button class="live-control" id="type-toggle-btn" style="background:none; border:none;">
      <div class="live-control__icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M9 13h6"/></svg>
      </div>
      <span>Type Instead</span>
    </button>
  </div>

  <div class="type-bar" id="type-bar">
    <div class="ask-box">
      <input type="text" id="type-input" placeholder="Type your message..." autocomplete="off" />
      <button class="ask-box__send" id="type-send" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
      </button>
    </div>
  </div>

</div>

<script src="../../config/config.js"></script>
<script src="../../services/api.js"></script>
<script src="../../services/auth-service.js"></script>
<script src="../../services/chat-service.js"></script>
<script src="live.js"></script>
</body>
</html>
