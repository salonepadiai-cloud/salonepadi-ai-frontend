<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Live Conversation — JOHNNY TEC OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles/variables.css" />
<link rel="stylesheet" href="../../styles/global.css" />
<link rel="stylesheet" href="live.css" />
</head>
<body>
<div id="app" style="display:flex; flex-direction:column; height:100vh;">

  <header class="live-topbar">
    <button class="live-icon-btn" id="back-btn" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="live-topbar__title">JOHNNY TEC OS</div>
    <button class="live-icon-btn" id="voice-settings-btn" aria-label="Voice settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M2 14h4"/><path d="M10 8h4"/><path d="M18 16h4"/></svg>
    </button>
  </header>

  <div class="live-screen">
    <div class="orb-stage">
      <div class="waveform waveform--left" id="wave-left">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="big-orb" id="live-orb">
        <div class="big-orb__glow" id="orb-glow"></div>
        <canvas id="orb-canvas"></canvas>
      </div>

      <div class="waveform waveform--right" id="wave-right">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="live-status">
      <h2 id="status-title">Ready and waiting for you...</h2>
      <p id="status-subtitle">Tap the orb to start talking.</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="../../config/config.js"></script>
<script src="../../services/api.js"></script>
<script src="../../services/auth-service.js"></script>
<script src="../../services/chat-service.js"></script>
<script src="live.js"></script>
</body>
</html>
